<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>砼 · VI 编辑器</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b3b0aa'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%23292722' font-family='serif'%3E%E7%A0%BC%3C/text%3E%3C/svg%3E">
<style>
/* ============ 清水混凝土主题 ============ */
:root{
  --bg:#b3b0aa; --bg-deep:#a8a5a0;
  --panel:#c9c6c0; --panel-2:#c0bdb7; --panel-3:#d3d0ca;
  --line:#8f8c86; --line-soft:#a5a29c;
  --ink:#292722; --ink-2:#57544d; --ink-3:#7c786f;
  --field:#dcd9d3; --field-line:#9b988f;
  --num:#b3742d; --bool:#5f8a4b; --str:#b05a7e; --bad:#3a3833;
  --accent:#2e2c27;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--bg); overflow:hidden; user-select:none;
}
/* 混凝土噪点 + 光影 */
body::before{content:"";position:fixed;inset:0;z-index:998;pointer-events:none;
  background:radial-gradient(ellipse 120% 90% at 50% 20%,rgba(255,255,255,.10),rgba(0,0,0,.07) 100%);}
body::after{content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='240' height='240' filter='url(%23n)'/%3E%3C/svg%3E");}
/* 对拉螺栓孔(模板痕迹) */
.ties{position:relative}
.ties::before,.ties::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;z-index:5;
  background:radial-gradient(circle at 4px 4px,#4e4b45 0 1.5px,#6c6963 1.5px 3.4px,rgba(255,255,255,.28) 3.6px 4.2px,rgba(0,0,0,.14) 4.4px,transparent 4.8px);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35);}
.ties::before{top:7px;right:9px}
.ties::after{bottom:7px;right:9px}

#app{display:flex;flex-direction:column;height:100%}
/* ---------- 顶栏 ---------- */
header#topbar{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 20px;
  background:linear-gradient(#cdcac4,#c3c0ba);border-bottom:1px solid var(--line);
  box-shadow:inset 0 1px 0 #dedbd5,0 2px 8px rgba(0,0,0,.14);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:10px}
.brand h1{font:600 17px/1.1 Georgia,"Times New Roman","STSong","SimSun",serif;letter-spacing:.34em;color:var(--ink)}
.brand small{font:9.5px/1 "Segoe UI";letter-spacing:.3em;color:var(--ink-3);margin-top:3px}
.sep{width:1px;height:22px;background:var(--line-soft);margin:0 3px;flex:none}
.btn{appearance:none;border:1px solid #8b8882;border-radius:2px;padding:5px 11px;
  font:12.5px "Segoe UI","Microsoft YaHei";color:var(--ink);
  background:linear-gradient(#d6d3cd,#c6c3bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap}
.btn:hover{background:linear-gradient(#dedbd5,#cdcac4)}
.btn:active{background:#b9b6b0;box-shadow:inset 0 1px 3px rgba(0,0,0,.22)}
.btn:disabled{opacity:.42;cursor:default;background:#c6c3bd}
.btn.primary{background:linear-gradient(#4a4741,#35332e);color:#e8e5df;border-color:#23211d}
.btn.primary:hover{background:linear-gradient(#54514a,#3d3b35)}
.btn.run{padding:6px 16px;font-weight:600;letter-spacing:.08em}
.btn.run.broken{background:linear-gradient(#6d6a63,#4a4741);border:1px dashed #d8b08a;color:#e8c9a4}
#projName{width:170px;background:var(--field);border:1px solid var(--field-line);border-radius:2px;
  padding:4px 9px;font:12.5px "Segoe UI","Microsoft YaHei";color:var(--ink)}
#projName:focus{outline:1.5px solid #6a675f}
#srcChip{font:11px ui-monospace,Consolas,monospace;color:var(--ink-2);border:1px solid var(--line-soft);
  padding:3px 8px;border-radius:2px;background:rgba(255,255,255,.14);max-width:190px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1}
/* ---------- 主体 ---------- */
#main{flex:1;display:flex;min-height:0}
aside#palette{width:156px;flex:none;background:var(--panel-2);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 8px 24px;box-shadow:inset -3px 0 6px -4px rgba(0,0,0,.15)}
.pgroup{margin-bottom:11px}
.pgroup h3{font:600 10px "Segoe UI","Microsoft YaHei";letter-spacing:.22em;color:var(--ink-3);
  padding:3px 4px 5px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;padding:4px 5px;border:1px solid transparent;
  background:none;cursor:grab;font:12px "Segoe UI","Microsoft YaHei";color:var(--ink);text-align:left;border-radius:2px}
.pitem:hover{border-color:#8b8882;background:#cdcac4}
.pitem:active{cursor:grabbing}
.pitem .glyph{width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--line);
  background:linear-gradient(#d9d6d0,#c8c5bf);font:600 12px Georgia,serif;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);color:var(--ink)}
.pitem .glyph.dark{background:linear-gradient(#4a4741,#35332e);color:#d8d5cf;border-color:#23211d}
.pitem .glyph.tc{color:var(--num)} .pitem .glyph.tb{color:var(--bool)} .pitem .glyph.ts{color:var(--str)}
/* ---------- 舞台 ---------- */
#stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-deep)}
.tabs{display:flex;align-items:center;padding:8px 14px 0;background:var(--panel-2);border-bottom:1px solid var(--line)}
.tab{padding:6px 24px;font:12.5px "Segoe UI","Microsoft YaHei";color:var(--ink-2);cursor:pointer;position:relative;top:1px;
  border:1px solid var(--line);border-bottom:none;border-radius:3px 3px 0 0;background:linear-gradient(#c2bfb9,#bab7b1);margin-right:-1px}
.tab.on{background:var(--bg-deep);color:var(--ink);font-weight:600;border-bottom:1px solid var(--bg-deep)}
.tabhint{margin-left:12px;font:11px;color:var(--ink-3);letter-spacing:.05em}
#canvasWrap{flex:1;position:relative;min-height:0;background:var(--bg-deep)}
svg#diagram{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#diagram text{pointer-events:none}
#diagram g.node{cursor:move}
#diagram [data-wire]{cursor:pointer}
#diagram .handle{cursor:nwse-resize}
.term{transform-box:fill-box;transform-origin:center;transition:transform .12s}
.term:hover{stroke-width:2.4px}
.term.compat{animation:tpulse .7s ease-in-out infinite alternate}
@keyframes tpulse{from{transform:scale(1)}to{transform:scale(1.7)}}
#fpView{position:absolute;inset:0;overflow:auto;padding:30px 34px 50px;display:none}
#fpGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;max-width:980px}
.fpw{background:var(--panel);border:1px solid var(--line);padding:13px 15px;position:relative;
  box-shadow:inset 0 1px 0 #dfdcD6,0 1px 4px rgba(0,0,0,.10)}
.fpw>label{display:block;font:600 11px "Segoe UI","Microsoft YaHei";letter-spacing:.12em;color:var(--ink-2);margin-bottom:9px}
.fp input[type=number],.fp input[type=text]{width:100%;background:var(--field);border:1px solid var(--field-line);
  border-radius:2px;padding:6px 9px;font:14px ui-monospace,Consolas,monospace;color:var(--ink)}
.fp input:focus{outline:1.5px solid #6a675f}
.fp-ind{background:#35332e;color:#d8d5cf;font:600 15px ui-monospace,Consolas,monospace;padding:7px 11px;
  border:1px solid #57544d;min-height:33px;border-radius:2px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.led{width:36px;height:36px;border-radius:50%;border:1.5px solid #514e46;background:#494640;cursor:pointer;flex:none;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
.led.on{background:#7aa563;box-shadow:inset 0 1px 3px rgba(255,255,255,.35),0 0 0 3px rgba(122,165,99,.16)}
.flash{animation:flash .55s}
@keyframes flash{0%{box-shadow:0 0 0 4px rgba(179,116,45,.5)}100%{box-shadow:none}}
.fp-empty{grid-column:1/-1;color:var(--ink-3);font:13px/1.9;border:1px dashed var(--line-soft);padding:26px 30px;max-width:640px}
#zoomCtl{position:absolute;right:14px;bottom:14px;display:flex;gap:5px;align-items:center;z-index:6}
#zoomCtl .btn{padding:3px 9px}
#zoomPct{font:11.5px ui-monospace,Consolas,monospace;color:var(--ink-2);width:44px;text-align:center;
  background:rgba(255,255,255,.25);border:1px solid var(--line-soft);border-radius:2px;padding:3px 0;cursor:pointer}
/* ---------- 检查器 ---------- */
aside#inspector{width:238px;flex:none;background:var(--panel-2);border-left:1px solid var(--line);
  overflow-y:auto;padding:13px 13px 26px;box-shadow:inset 3px 0 6px -4px rgba(0,0,0,.15)}
aside#inspector h4{font:600 10px "Segoe UI","Microsoft YaHei";letter-spacing:.22em;color:var(--ink-3);
  padding:3px 2px 5px;border-bottom:1px solid var(--line-soft);margin:14px 0 9px}
aside#inspector h4:first-child{margin-top:0}
.fld{margin-bottom:9px}
.fld>label{display:block;font:11px;color:var(--ink-2);margin-bottom:4px;letter-spacing:.06em}
.fld input[type=text],.fld input[type=number],.fld textarea{width:100%;background:var(--field);
  border:1px solid var(--field-line);border-radius:2px;padding:5px 8px;font:12.5px "Segoe UI","Microsoft YaHei";color:var(--ink)}
.fld textarea{resize:vertical;min-height:96px;font:12px/1.6}
.fld input:focus,.fld textarea:focus{outline:1.5px solid #6a675f}
.kv{display:flex;justify-content:space-between;font:11.5px;color:var(--ink-2);padding:2.5px 2px}
.kv b{color:var(--ink);font-weight:600}
.chip{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:1px 7px;font:10.5px ui-monospace,Consolas;
  margin:0 4px 4px 0;background:rgba(255,255,255,.18);color:var(--ink-2)}
.hintlist{font:11.5px/1.85;color:var(--ink-2)}
.hintlist em{font-style:normal;color:var(--ink);background:rgba(255,255,255,.28);padding:0 4px;border-radius:2px;border:1px solid var(--line-soft)}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1;text-align:center}
/* ---------- 状态栏 ---------- */
footer#status{display:flex;align-items:center;gap:16px;padding:5px 15px;background:#292722;color:#b3b0aa;
  font:11.5px "Segoe UI","Microsoft YaHei";letter-spacing:.04em;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
#statusErr{cursor:pointer;color:#cfa163}
#statusErr.ok{color:#9fb08d}
#statusErr:hover{text-decoration:underline}
#statusZoom,#statusXY{font:11px ui-monospace,Consolas,monospace;color:#8f8c86}
/* ---------- 弹层 ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(30,29,26,.46);display:none;place-items:center;z-index:100}
.modal{width:min(660px,93vw);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid #7c7973;
  box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 #e2dfd9}
.modal>header{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(#d0cdc7,#c6c3bd)}
.modal h2{font:600 14.5px Georgia,"STSong","SimSun",serif;letter-spacing:.24em;color:var(--ink)}
.modal .mbody{padding:16px 20px 18px;font-size:12.8px;line-height:1.75}
.modal .mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.mtable{width:100%;border-collapse:collapse;font:11.5px ui-monospace,Consolas,monospace;margin:8px 0}
.mtable th,.mtable td{border:1px solid var(--line-soft);padding:3px 8px;text-align:left;color:var(--ink-2)}
.mtable th{background:rgba(255,255,255,.22);font-family:"Segoe UI","Microsoft YaHei";font-size:11px;letter-spacing:.08em}
.errrow{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line-soft);
  padding:7px 6px;font:12px "Segoe UI","Microsoft YaHei";color:#6e3a2a;cursor:pointer}
.errrow:hover{background:rgba(0,0,0,.05)}
.errrow.warn{color:var(--ink-2)}
#toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#35332e;color:#ddd9d2;border:1px solid #514e46;padding:7px 18px;border-radius:2px;font:12.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.3);animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.ghost{position:fixed;z-index:150;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  padding:4px 10px;font:12px;box-shadow:0 6px 16px rgba(0,0,0,.25);border-radius:2px}
.xlist{max-height:168px;overflow:auto;border:1px solid var(--line-soft);background:rgba(255,255,255,.25);margin:5px 0 10px}
.xlist div{padding:2.5px 10px;font:11.5px ui-monospace,Consolas,monospace;color:var(--ink-2);border-bottom:1px dashed var(--line-soft);word-break:break-all}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#96938d;border:2px solid var(--panel-2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="ties">
    <div class="brand"><h1>砼 · VI 编辑器</h1><small>FAIR-FACED CONCRETE · VI STUDIO</small></div>
    <div class="sep"></div>
    <button class="btn" id="btnNew" title="清空并新建工程">新建</button>
    <button class="btn" id="btnOpen" title="导入 .vi(读取元数据)或 .vidoc.json 工程">打开…</button>
    <button class="btn" id="btnSave" title="导出可再编辑的工程 JSON(Ctrl+S)">保存工程</button>
    <div class="sep"></div>
    <button class="btn" id="btnUndo" title="撤销 (Ctrl+Z)">撤销</button>
    <button class="btn" id="btnRedo" title="重做 (Ctrl+Y)">重做</button>
    <div class="sep"></div>
    <button class="btn" id="btnSvg" title="导出带图签的框图 SVG">导出 SVG</button>
    <button class="btn" id="btnPng" title="导出 PNG 图片">导出 PNG</button>
    <div class="sep"></div>
    <button class="btn primary run" id="btnRun" title="数据流求值:把结果写到指示器">▶ 运行</button>
    <div class="grow"></div>
    <input id="projName" value="未命名工程" title="工程名称(随 JSON 一起保存)">
    <span id="srcChip" title="工程来源">new</span>
    <div class="sep"></div>
    <button class="btn" id="btnDemo" title="载入演示工程">示例</button>
    <button class="btn" id="btnHelp" title="使用说明与格式说明">帮助</button>
  </header>

  <div id="main">
    <aside id="palette" class="ties"></aside>

    <section id="stage">
      <div class="tabs">
        <div class="tab on" data-tab="diagram">程序框图</div>
        <div class="tab" data-tab="panel">前面板</div>
        <span class="tabhint" id="tabHint">拖动端子连线 · 滚轮缩放 · 空格拖动平移</span>
      </div>
      <div id="canvasWrap">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
              <circle cx="8" cy="8" r="0.9" fill="#9d9a94"/>
            </pattern>
            <filter id="nshadow" x="-20%" y="-20%" width="140%" height="160%">
              <feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#3a3833" flood-opacity="0.22"/>
            </filter>
          </defs>
          <rect id="gridRect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"/>
          <g id="gRoot">
            <g id="gUnder"></g><g id="gWires"></g><g id="gNodes"></g><g id="gTemp"></g>
          </g>
        </svg>
        <div id="fpView"><div id="fpGrid"></div></div>
        <div id="zoomCtl">
          <button class="btn" id="zOut" title="缩小">−</button>
          <div id="zoomPct" title="点击复位 100%">100%</div>
          <button class="btn" id="zIn" title="放大">+</button>
          <button class="btn" id="zFit" title="适配全部内容">适配</button>
        </div>
      </div>
    </section>

    <aside id="inspector" class="ties"></aside>
  </div>

  <footer id="status">
    <span id="statusHint">就绪</span>
    <span class="grow" style="flex:1"></span>
    <span id="statusErr" class="ok">✓ 检查通过</span>
    <span id="statusZoom">100%</span>
    <span id="statusXY">x 0, y 0</span>
  </footer>
</div>

<div id="modalWrap"><div class="modal ties"><header><h2 id="mTitle"></h2></header>
  <div class="mbody" id="mBody"></div><div class="mfoot" id="mFoot"></div></div></div>
<div id="toasts"></div>
<input type="file" id="fileInput" hidden accept=".vi,.json,.ctl,.llb,.vit,.vidoc.json">

<script>
"use strict";
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const SVGNS="http://www.w3.org/2000/svg";
const FONT_UI='"Segoe UI","Microsoft YaHei",sans-serif';
const FONT_SERIF='Georgia,"Times New Roman",serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const snap8=v=>Math.round(v/8)*8;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function S(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;
  $('#toasts').appendChild(d);setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity='0';
  setTimeout(()=>d.remove(),420);},2400);}
function fmtNum(v){if(typeof v!=='number'||!isFinite(v))return String(v);
  if(Number.isInteger(v))return String(v);
  const s=Number(v.toPrecision(6));return String(s);}
function fmtVal(v){if(v===undefined||v===null)return '—';
  if(typeof v==='boolean')return v?'真':'假';
  if(typeof v==='number')return fmtNum(v);
  const s=String(v);return s.length>12?s.slice(0,12)+'…':s;}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);}
const safeName=s=>(s||'未命名工程').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,60);

/* ================= 类型与节点注册表 ================= */
const T={num:{c:'#b3742d',n:'数值'},bool:{c:'#5f8a4b',n:'布尔'},str:{c:'#b05a7e',n:'字符串'}};
const KINDS={
  numCtl :{cat:'ctl',ins:[],outs:[['数值','num']],label:'数值控件'},
  boolCtl:{cat:'ctl',ins:[],outs:[['值','bool']],label:'布尔控件'},
  strCtl :{cat:'ctl',ins:[],outs:[['文本','str']],label:'字符串控件'},
  numInd :{cat:'ind',ins:[['数值','num']],outs:[],label:'数值指示器'},
  boolInd:{cat:'ind',ins:[['值','bool']],outs:[],label:'布尔指示器'},
  strInd :{cat:'ind',ins:[['文本','str']],outs:[],label:'字符串指示器'},
  numConst :{cat:'const',ins:[],outs:[['值','num']],label:'数值常数',def:0},
  boolConst:{cat:'const',ins:[],outs:[['值','bool']],label:'真假常数',def:true},
  strConst :{cat:'const',ins:[],outs:[['文本','str']],label:'文本常数',def:'文本'},
  add:{cat:'fn',ins:[['A','num'],['B','num']],outs:[['A+B','num']],glyph:'+',label:'加',fn:(a,b)=>a+b},
  sub:{cat:'fn',ins:[['A','num'],['B','num']],outs:[['A−B','num']],glyph:'−',label:'减',fn:(a,b)=>a-b},
  mul:{cat:'fn',ins:[['A','num'],['B','num']],outs:[['A×B','num']],glyph:'×',label:'乘',fn:(a,b)=>a*b},
  div:{cat:'fn',ins:[['A','num'],['B','num']],outs:[['A÷B','num']],glyph:'÷',label:'除',
       fn:(a,b)=>{if(b===0)throw new Error('除数为零');return a/b;}},
  neg:{cat:'fn',ins:[['x','num']],outs:[['−x','num']],glyph:'−',label:'取负',fn:a=>-a},
  rand:{cat:'fn',ins:[],outs:[['0…1','num']],glyph:'rnd',label:'随机数'},
  gt:{cat:'fn',ins:[['A','num'],['B','num']],outs:[['A>B','bool']],glyph:'>',label:'大于',fn:(a,b)=>a>b},
  lt:{cat:'fn',ins:[['A','num'],['B','num']],outs:[['A<B','bool']],glyph:'<',label:'小于',fn:(a,b)=>a<b},
  eq:{cat:'fn',ins:[['A','num'],['B','num']],outs:[['A=B','bool']],glyph:'=',label:'等于',fn:(a,b)=>a===b},
  and:{cat:'fn',ins:[['A','bool'],['B','bool']],outs:[['A∧B','bool']],glyph:'∧',label:'与',fn:(a,b)=>a&&b},
  or :{cat:'fn',ins:[['A','bool'],['B','bool']],outs:[['A∨B','bool']],glyph:'∨',label:'或',fn:(a,b)=>a||b},
  not:{cat:'fn',ins:[['x','bool']],outs:[['¬x','bool']],glyph:'¬',label:'非',fn:a=>!a},
  concat:{cat:'fn',ins:[['A','str'],['B','str']],outs:[['A+B','str']],glyph:'&',label:'字符串连接',fn:(a,b)=>String(a)+String(b)},
  len:{cat:'fn',ins:[['s','str']],outs:[['长度','num']],glyph:'#',label:'字符串长度',fn:s=>String(s).length},
  forFrame:{cat:'frame',ins:[['N','num']],outs:[],label:'For 循环'},
  whileFrame:{cat:'frame',ins:[['停止','bool']],outs:[],label:'While 循环'},
  note:{cat:'note',ins:[],outs:[],label:'注释'},
};
const PALETTE=[
  ['控件与指示器',['numCtl','boolCtl','strCtl','numInd','boolInd','strInd']],
  ['常数',['numConst','boolConst','strConst']],
  ['数值运算',['add','sub','mul','div','neg','rand']],
  ['比较',['gt','lt','eq']],
  ['布尔运算',['and','or','not']],
  ['字符串',['concat','len']],
  ['结构',['forFrame','whileFrame']],
  ['其他',['note']],
];
const PALETTE_GLYPH={numCtl:['123','tc'],boolCtl:['T/F','tb'],strCtl:['abc','ts'],
  numInd:['123','dark'],boolInd:['T/F','dark'],strInd:['abc','dark'],
  numConst:['#','tc'],boolConst:['T','tb'],strConst:['"','ts'],
  forFrame:['N↻',''],whileFrame:['∞',''],note:['¶','']};

function defSize(kind){const k=KINDS[kind];
  if(k.cat==='fn')return [56,44];
  if(k.cat==='ctl'||k.cat==='ind')return [92,58];
  if(k.cat==='const')return [68,44];
  if(k.cat==='note')return [210,120];
  if(k.cat==='frame')return [250,180];
  return [80,50];}

/* ================= 状态 ================= */
let state={name:'未命名工程',meta:{source:'new',labview:null},nodes:[],wires:[],seq:1};
let selection={nodes:new Set(),wires:new Set()};
let view={x:0,y:0,k:1};
let mode=null, pending=null, penCur=null, spaceHeld=false, selDirty=true;
let undoStack=[], redoStack=[];
let lastIssues={errs:[],warns:[]};

const nodeById=id=>state.nodes.find(n=>n.id===id);
const wireInto=(node,term)=>state.wires.find(w=>w.to===node&&w.toTerm===term);

function countKind(kind){return state.nodes.filter(n=>n.kind===kind).length;}
function addNode(kind,x,y){
  const [w,h]=defSize(kind), k=KINDS[kind];
  const n={id:'n'+(state.seq++),kind,label:k.label+' '+(countKind(kind)+1),x:snap8(x-w/2),y:snap8(y-h/2),w,h,props:{}};
  if(k.cat==='const'||k.cat==='ctl')n.props.value=structuredClone(k.def);
  if(kind==='forFrame')n.props.n=5;
  if(kind==='note')n.props.text=k.label+'…\n(在右侧检查器中编辑内容)';
  state.nodes.push(n);return n;}

function termPos(n,dir,i){const k=KINDS[n.kind];
  if(k.cat==='frame'){
    if(n.kind==='forFrame')return {x:n.x+18,y:n.y};
    return {x:n.x+n.w-18,y:n.y+n.h};}
  if(dir==='in'){const m=k.ins.length;return {x:n.x,y:n.y+n.h*(i+1)/(m+1)};}
  const m=k.outs.length;return {x:n.x+n.w,y:n.y+n.h*(i+1)/(m+1)};}

function orthPath(x1,y1,x2,y2){
  const r=v=>Math.round(v*10)/10;
  if(Math.abs(y1-y2)<1.5)return `M${r(x1)},${r(y1)} L${r(x2)},${r(y2)}`;
  const m=(x2>x1+24)?(x1+x2)/2:Math.max(x1,x2)+24;
  return `M${r(x1)},${r(y1)} L${r(m)},${r(y1)} L${r(m)},${r(y2)} L${r(x2)},${r(y2)}`;}

/* ================= 撤销 / 持久化 ================= */
function serialize(){return JSON.stringify({name:state.name,meta:state.meta,nodes:state.nodes,wires:state.wires,seq:state.seq});}
function applyDoc(str){const o=JSON.parse(str);
  state.name=o.name;state.meta=o.meta||{source:'new'};state.nodes=o.nodes||[];state.wires=o.wires||[];state.seq=o.seq||1;
  state.nodes.forEach(n=>{delete n._val;delete n._flash;});
  selection.nodes.clear();selection.wires.clear();selDirty=true;}
function snapshot(){undoStack.push(serialize());if(undoStack.length>100)undoStack.shift();redoStack.length=0;updateUndoBtns();}
function undo(){if(!undoStack.length)return;redoStack.push(serialize());applyDoc(undoStack.pop());updateUndoBtns();render();renderPanel();}
function redo(){if(!redoStack.length)return;undoStack.push(serialize());applyDoc(redoStack.pop());updateUndoBtns();render();renderPanel();}
function updateUndoBtns(){$('#btnUndo').disabled=!undoStack.length;$('#btnRedo').disabled=!redoStack.length;}

let lsTimer=null;
function autosave(){clearTimeout(lsTimer);lsTimer=setTimeout(()=>{try{
  localStorage.setItem('tong_vi_last',JSON.stringify({ts:Date.now(),doc:serialize()}));}catch(e){}},600);}

/* ================= 渲染 ================= */
const svg=$('#diagram'),gRoot=$('#gRoot'),gUnder=$('#gUnder'),gWires=$('#gWires'),gNodes=$('#gNodes'),gTemp=$('#gTemp');
function syncView(){gRoot.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  $('#grid').setAttribute('patternTransform',`translate(${view.x},${view.y}) scale(${view.k})`);
  $('#zoomPct').textContent=Math.round(view.k*100)+'%';$('#statusZoom').textContent=Math.round(view.k*100)+'%';}

function drawWire(w,parent,opts){const a=nodeById(w.from),b=nodeById(w.to);if(!a||!b)return;
  const p1=termPos(a,'out',w.fromTerm),p2=termPos(b,'in',w.toTerm);
  const ty=KINDS[a.kind].outs[w.fromTerm][1];
  const ok=ty===KINDS[b.kind].ins[w.toTerm][1];
  const d=orthPath(p1.x,p1.y,p2.x,p2.y);
  const sel=selection.wires.has(w.id)&&!opts.export;
  if(sel)S('path',{d,fill:'none',stroke:'#2e2c27','stroke-opacity':.3,'stroke-width':7,'stroke-linejoin':'round','pointer-events':'none'},parent);
  S('path',{d,fill:'none',stroke:ok?T[ty].c:'#3a3833','stroke-width':ok?3:2,
    'stroke-linejoin':'round','stroke-dasharray':ok?'none':'6 4','pointer-events':'none'},parent);
  if(!opts.export)S('path',{d,fill:'none',stroke:'rgba(0,0,0,0)','stroke-width':13,'data-wire':w.id},parent);}

function wrapText(text,wPx){const out=[];for(const raw of String(text).split('\n')){
  let line='',wd=0;for(const ch of raw){const cw=ch.charCodeAt(0)>255?12:6.6;
    if(wd+cw>wPx-24){out.push(line);line=ch;wd=cw;}else{line+=ch;wd+=cw;}}
  out.push(line);}return out;}

function drawNode(n,parent,opts){const k=KINDS[n.kind];
  const g=S('g',{class:'node','data-node':n.id,transform:`translate(${n.x},${n.y})`},parent);
  if(k.cat==='frame'){
    S('rect',{width:n.w,height:n.h,fill:'#b7b4ae',stroke:'#494640','stroke-width':1.4},g);
    S('rect',{x:1,y:1,width:n.w-2,height:17,fill:'rgba(255,255,255,.10)'},g);
    const t=S('text',{x:9,y:13,'font-family':FONT_UI,'font-size':11,'font-weight':600,fill:'#292722'},g);
    t.textContent=(n.kind==='forFrame'?'↻ For 循环':'↻ While 循环');
    if(selection.nodes.has(n.id)&&!opts.export)
      S('rect',{x:n.w-10.5,y:n.h-10.5,width:9,height:9,fill:'#cdcac4',stroke:'#494640','stroke-width':1,class:'handle','data-node':n.id},g);
  }else if(k.cat==='note'){
    S('rect',{width:n.w,height:n.h,fill:'#c3bfb8',stroke:'#494640','stroke-width':1.1,filter:'url(#nshadow)'},g);
    S('path',{d:`M0,0 L${n.w-16},0 L${n.w},16 L${n.w},0 Z`,fill:'rgba(0,0,0,.001)'},g);
    S('path',{d:`M${n.w-16},0 L${n.w-16},16 L${n.w},16`,fill:'none',stroke:'#494640','stroke-width':1},g);
    S('rect',{x:0,y:0,width:4,height:n.h,fill:'#8f8c86'},g);
    wrapText(n.props.text||'',n.w).slice(0,Math.floor((n.h-14)/16)).forEach((ln,i)=>{
      const t=S('text',{x:12,y:20+i*16,'font-family':FONT_UI,'font-size':12,fill:'#33302a'},g);t.textContent=ln;});
  }else{
    S('rect',{width:n.w,height:n.h,rx:3,fill:'#cdcac4',stroke:'#494640','stroke-width':1.2,filter:'url(#nshadow)'},g);
    if(k.cat==='fn'){
      const gl=k.glyph;
      const t=S('text',{x:n.w/2,y:n.h/2+(gl.length>1?-1:7),'font-family':FONT_SERIF,'font-size':gl.length>1?12:22,
        'font-weight':600,fill:'#292722','text-anchor':'middle'},g);t.textContent=gl;
    }else if(k.cat==='const'){
      const t=S('text',{x:n.w/2,y:n.h/2+5.5,'font-family':'ui-monospace,Consolas,monospace','font-size':13,
        'font-weight':600,fill:'#292722','text-anchor':'middle'},g);
      t.textContent=n.kind==='boolConst'?(n.props.value?'真':'假'):fmtVal(n.props.value);
    }else if(k.cat==='ctl'||k.cat==='ind'){
      const fx=10,fy=9,fw=n.w-20,fh=n.h-19;
      if(k.cat==='ctl'){
        S('rect',{x:fx,y:fy,width:fw,height:fh,fill:'#dad7d1',stroke:'#8f8c86','stroke-width':1},g);
        const ty=KINDS[n.kind].outs[0][1];
        const t=S('text',{x:n.w/2,y:n.h/2+2,'font-family':'ui-monospace,Consolas,monospace','font-size':11,fill:'#6f6b63','text-anchor':'middle'},g);
        t.textContent=ty==='num'?'123':(ty==='bool'?(n.props.value?'TRUE':'FALSE'):'abc');
      }else{
        S('rect',{x:fx,y:fy,width:fw,height:fh,fill:'#37342f',stroke:'#575349','stroke-width':1},g);
        const ty=KINDS[n.kind].ins[0][1];
        if(ty==='bool'){
          S('circle',{cx:n.w/2,cy:n.h/2-2,r:9,fill:(n._val===undefined)?'#494640':(n._val?'#7aa563':'#494640'),
            stroke:'#6e6b63','stroke-width':1},g);
        }else{
          const t=S('text',{x:n.w/2,y:n.h/2+2,'font-family':'ui-monospace,Consolas,monospace','font-size':11,
            fill:'#d8d5cf','text-anchor':'middle'},g);t.textContent=fmtVal(n._val);
        }
      }
    }
  }
  /* 端子 */
  if(!opts.export){
    k.ins.forEach((tm,i)=>{const p=termPos(n,'in',i);
      const extra=(k.cat==='frame')?{width:10,height:10,x:p.x-5,y:p.y-5}:{width:9,height:9,x:p.x-4.5,y:p.y-4.5};
      S('rect',Object.assign({class:'term','data-term':'1','data-node':n.id,'data-dir':'in','data-idx':i,
        fill:T[tm[1]].c,stroke:'#2a2823','stroke-width':.9,rx:1},extra),g);});
    k.outs.forEach((tm,i)=>{const p=termPos(n,'out',i);
      S('rect',{class:'term','data-term':'1','data-node':n.id,'data-dir':'out','data-idx':i,
        x:p.x-4.5,y:p.y-4.5,width:9,height:9,fill:T[tm[1]].c,stroke:'#2a2823','stroke-width':.9,rx:1},g);});
    if(k.cat==='frame'){
      if(n.kind==='forFrame'){const t=S('text',{x:n.x*0+18,y:-7,'font-family':FONT_UI,'font-size':9,fill:'#57544d','text-anchor':'middle'},g);t.textContent='N';}
      else{const t=S('text',{x:n.w-18,y:n.h+12,'font-family':FONT_UI,'font-size':9,fill:'#57544d','text-anchor':'middle'},g);t.textContent='停';}
    }
  }
  /* 标签 */
  const lb=S('text',{x:n.w/2,y:n.h+14,'font-family':FONT_UI,'font-size':11,fill:'#292722','text-anchor':'middle',
    stroke:'#a8a5a0','stroke-width':3,'paint-order':'stroke'},g);
  lb.textContent=n.label||'';
  /* 选中角标(建筑图纸风) */
  if(selection.nodes.has(n.id)&&!opts.export){
    const m=5,L=9,x2=n.w+m,y2=n.h+m,x1=-m,y1=-m;
    S('path',{d:`M${x1},${y1+L} L${x1},${y1} L${x1+L},${y1} M${x2-L},${y1} L${x2},${y1} L${x2},${y1+L} M${x2},${y2-L} L${x2},${y2} L${x2-L},${y2} M${x1+L},${y2} L${x1},${y2} L${x1},${y2-L}`,
      fill:'none',stroke:'#2e2c27','stroke-width':2,'pointer-events':'none'},g);}
  return g;}

function renderScene(){
  gUnder.innerHTML='';gWires.innerHTML='';gNodes.innerHTML='';gTemp.innerHTML='';
  for(const n of state.nodes)if(KINDS[n.kind].cat==='frame')drawNode(n,gUnder,{});
  for(const w of state.wires)drawWire(w,gWires,{});
  for(const n of state.nodes)if(KINDS[n.kind].cat!=='frame')drawNode(n,gNodes,{});
  if(pending&&penCur){
    const fromOut=pending.dir==='out';
    const fx=termPos(nodeById(pending.node),pending.dir,pending.term);
    const ty=KINDS[nodeById(pending.node).kind][pending.dir==='out'?'outs':'ins'][pending.term][1];
    const d=fromOut?orthPath(fx.x,fx.y,penCur.x,penCur.y):orthPath(penCur.x,penCur.y,fx.x,fx.y);
    S('path',{d,fill:'none',stroke:T[ty].c,'stroke-width':3,'stroke-opacity':.55,'stroke-dasharray':'2 4'},gTemp);}
  syncView();updateStatus();updateRunState();autosave();}

function render(){renderScene();if(selDirty){renderInspector();selDirty=false;}renderPanel();}

function updateStatus(){
  const hints={idle:'点击左侧调板添加 · 拖动端子连线 · 空格+拖动平移 · 滚轮缩放 · Delete 删除',
    wire:'连线中:点击对侧端子完成,Esc 取消',drag:'拖动中(8px 网格吸附)',pan:'平移画布',resize:'调整结构边框'};
  $('#statusHint').textContent=hints[mode?mode.t:'idle'];}

/* ================= 静态检查 / 运行 ================= */
function inWireMap(){const m=new Map();for(const w of state.wires)m.set(w.to+':'+w.toTerm,w);return m;}
function computeStaticIssues(){
  const errs=[],warns=[],inW=inWireMap();
  for(const w of state.wires){const a=nodeById(w.from),b=nodeById(w.to);if(!a||!b)continue;
    const t1=KINDS[a.kind].outs[w.fromTerm][1],t2=KINDS[b.kind].ins[w.toTerm][1];
    if(t1!==t2)errs.push({msg:`类型不匹配(${T[t1].n}→${T[t2].n}):「${a.label}」→「${b.label}」`,wire:w.id});}
  for(const n of state.nodes){const k=KINDS[n.kind];
    if(k.cat==='fn'&&k.ins.length)k.ins.forEach((t,i)=>{if(!inW.has(n.id+':'+i))
      errs.push({msg:`「${n.label}」的输入「${t[0]}」未连接`,node:n.id});});
    if(k.cat==='ind'&&!inW.has(n.id+':0'))
      errs.push({msg:`指示器「${n.label}」未连接输入`,node:n.id});
    if(n.kind==='forFrame'&&!inW.has(n.id+':0'))
      warns.push({msg:`For 循环「${n.label}」N 未连接,将使用默认 ${n.props.n??5} 次`,node:n.id,warn:true});
    if(n.kind==='whileFrame'&&!inW.has(n.id+':0'))
      errs.push({msg:`While 循环「${n.label}」缺少停止条件(布尔)`,node:n.id});}
  /* 循环依赖 */
  const dep=new Map();
  for(const w of state.wires){if(!dep.has(w.to))dep.set(w.to,new Set());dep.get(w.to).add(w.from);}
  const color=new Map(),stack=[];
  let cyc=null;
  function dfs(id){if(cyc)return;color.set(id,1);stack.push(id);
    for(const d of (dep.get(id)||[])){if(color.get(d)===1){cyc=stack.slice(stack.indexOf(d)).concat(d);}
      else if(!color.has(d))dfs(d);}
    stack.pop();color.set(id,2);}
  for(const n of state.nodes){if(!color.has(n.id)){dfs(n.id);if(cyc)break;}}
  if(cyc)errs.push({msg:`存在循环依赖:${cyc.map(i=>nodeById(i)?.label||i).join(' → ')}`});
  return {errs,warns};}

function updateRunState(){lastIssues=computeStaticIssues();
  const {errs,warns}=lastIssues,el=$('#statusErr'),rb=$('#btnRun');
  if(errs.length){el.textContent=`⚠ ${errs.length} 项错误(点击查看)`;el.className='';rb.classList.add('broken');rb.textContent='⚠ 运行';}
  else if(warns.length){el.textContent=`${warns.length} 项提示(点击查看)`;el.className='ok';rb.classList.remove('broken');rb.textContent='▶ 运行';}
  else{el.textContent='✓ 检查通过';el.className='ok';rb.classList.remove('broken');rb.textContent='▶ 运行';}}

function runProgram(){
  const {errs,warns}=computeStaticIssues();
  if(errs.length){showErrList(errs.concat(warns));return;}
  const inW=inWireMap();
  const vals=new Map(),visiting=new Set();let rtErr=null;
  /* 几何归属:节点属于包含它的最小结构框 */
  const frames=state.nodes.filter(n=>KINDS[n.kind].cat==='frame')
    .sort((a,b)=>b.w*b.h-a.w*a.h);
  const childOf=new Map();
  for(const f of frames)for(const n of state.nodes){
    if(n.id===f.id)continue;
    const cx=n.x+n.w/2,cy=n.y+n.h/2;
    if(cx>f.x&&cx<f.x+f.w&&cy>f.y&&cy<f.y+f.h)childOf.set(n.id,f.id);}
  function subtreeIds(fid){const out=[];(function walk(id){
    for(const n of state.nodes)if(childOf.get(n.id)===id){out.push(n.id);
      if(KINDS[n.kind].cat==='frame')walk(n.id);}})(fid);return out;}
  function inputValue(nodeId,i){const w=inW.get(nodeId+':'+i);
    if(!w){rtErr={msg:`「${nodeById(nodeId).label}」输入未连接`,node:nodeId};throw rtErr;}
    return visit(w.from);}
  function visit(id){if(rtErr!==null&&rtErr!==undefined)return null;
    if(vals.has(id))return vals.get(id);
    if(visiting.has(id)){rtErr={msg:`循环依赖涉及「${nodeById(id)?.label||id}」`};return null;}
    visiting.add(id);
    const n=nodeById(id),k=KINDS[n.kind];let v=null;
    try{
      if(k.cat==='const'||k.cat==='ctl')v=n.props.value;
      else if(k.cat==='fn'){
        if(n.kind==='rand')v=Math.random();
        else{const args=k.ins.map((t,i)=>inputValue(n.id,i));
          v=k.fn.apply(null,args);}}
      else if(k.cat==='ind')v=inputValue(n.id,0);
      else if(k.cat==='frame')v=evalFrame(n);
    }catch(err){if(err&&err.msg&&!rtErr)rtErr={msg:`「${n.label}」:${err.msg}`,node:n.id};v=null;}
    visiting.delete(id);vals.set(id,v);return v;}
  function evalFrame(f){
    const kids=state.nodes.filter(x=>childOf.get(x.id)===f.id);
    const clear=()=>subtreeIds(f.id).forEach(i=>vals.delete(i));
    if(f.kind==='forFrame'){
      let N=inW.has(f.id+':0')?Math.floor(visit(inW.get(f.id+':0').from)):(f.props.n??5);
      if(!(N>=0&&N<=1e6)){rtErr={msg:`For 循环「${f.label}」次数无效:${N}`,node:f.id};return null;}
      for(let i=0;i<N&&!rtErr;i++){clear();kids.forEach(x=>visit(x.id));}
      if(!rtErr){clear();kids.forEach(x=>visit(x.id));}
    }else{
      let cnt=0;
      while(true){clear();kids.forEach(x=>visit(x.id));
        const stop=inW.has(f.id+':0')?!!visit(inW.get(f.id+':0').from):false;
        if(rtErr)break;
        if(stop)break;
        if(++cnt>10000){rtErr={msg:`While 循环「${f.label}」超过 10000 次迭代`,node:f.id};break;}}
    }
    return null;}
  try{state.nodes.forEach(n=>visit(n.id));}catch(e){}
  if(rtErr){showErrList([rtErr]);return;}
  state.nodes.forEach(n=>{if(KINDS[n.kind].cat==='ind'){n._val=vals.get(n.id);n._flash=true;}});
  renderScene();renderPanel();
  setTimeout(()=>{state.nodes.forEach(n=>delete n._flash);renderScene();renderPanel();},620);
  toast('运行完成 —— 结果已写入指示器');}

function showErrList(items){
  const rows=items.map((it,i)=>`<button class="errrow ${it.warn?'warn':''}" data-gi="${i}">${it.warn?'◐':'✖'} ${esc(it.msg)}</button>`).join('');
  showModal({title:'错误列表',bodyHTML:items.length?`<div id="errRows">${rows}</div>`:'<p>没有问题。</p>',
    buttons:[{label:'关闭'}],onOpen(box){box.querySelectorAll('[data-gi]').forEach(b=>b.addEventListener('click',()=>{
      const it=items[+b.dataset.gi];closeModal();
      if(it.node){const n=nodeById(it.node);if(n){selection.nodes.clear();selection.wires.clear();selection.nodes.add(n.id);selDirty=true;
        centerOn(n);render();renderPanel();return;}}
      if(it.wire){selection.nodes.clear();selection.wires.clear();selection.wires.add(it.wire);selDirty=true;render();renderPanel();}}));}});}

function centerOn(n){const r=$('#canvasWrap').getBoundingClientRect();
  const k=clamp(view.k,.4,2);
  view.k=k;view.x=r.width/2-(n.x+n.w/2)*k;view.y=r.height/2-(n.y+n.h/2)*k;}

/* ================= 交互 ================= */
function toWorld(cx,cy){const r=svg.getBoundingClientRect();
  return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k};}

function clearCompat(){svg.querySelectorAll('.term.compat').forEach(t=>t.classList.remove('compat'));}
function startWire(termEl){
  const dir=termEl.dataset.dir,idx=+termEl.dataset.idx,node=termEl.dataset.node;
  if(dir==='in'){const ex=wireInto(node,idx);
    if(ex){snapshot();state.wires=state.wires.filter(w=>w!==ex);
      pending={node:ex.from,term:ex.fromTerm,dir:'out'};renderScene();return;}}
  pending={node,term:idx,dir};}

function tryConnect(el){const b={node:el.dataset.node,dir:el.dataset.dir,idx:+el.dataset.idx};
  if(b.dir===pending.dir)return false;
  const out=pending.dir==='out'?pending:b, inp=pending.dir==='out'?b:pending;
  if(out.node===inp.node)return false;
  snapshot();
  state.wires=state.wires.filter(w=>!(w.to===inp.node&&w.toTerm===inp.term));
  if(state.wires.some(w=>w.from===out.node&&w.fromTerm===out.term&&w.to===inp.node&&w.toTerm===inp.term)){pending=null;return true;}
  state.wires.push({id:'w'+(state.seq++),from:out.node,fromTerm:out.term,to:inp.node,toTerm:inp.term});
  pending=null;return true;}

svg.addEventListener('pointerdown',e=>{
  if(e.button===1||spaceHeld){mode={t:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y};
    svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing';updateStatus();e.preventDefault();return;}
  if(e.button!==0)return;
  const t=e.target;
  const termEl=t.closest?t.closest('[data-term]'):null;
  if(termEl){startWire(termEl);mode={t:'wire'};svg.setPointerCapture(e.pointerId);updateStatus();e.preventDefault();return;}
  if(t.classList&&t.classList.contains('handle')){
    const n=nodeById(t.dataset.node);
    mode={t:'resize',id:n.id,sx:e.clientX,sy:e.clientY,w0:n.w,h0:n.h,snapped:false};
    svg.setPointerCapture(e.pointerId);updateStatus();e.preventDefault();return;}
  const nodeEl=t.closest?t.closest('g.node'):null;
  if(nodeEl){const id=nodeEl.dataset.node;
    if(!selection.nodes.has(id)){
      if(!e.shiftKey){selection.nodes.clear();selection.wires.clear();}
      selection.nodes.add(id);selDirty=true;}
    else if(e.shiftKey){selection.nodes.delete(id);selDirty=true;render();return;}
    const list=[...selection.nodes].map(i=>({n:nodeById(i),x0:nodeById(i).x,y0:nodeById(i).y}));
    mode={t:'drag',sx:e.clientX,sy:e.clientY,list,snapped:false};
    svg.setPointerCapture(e.pointerId);render();e.preventDefault();return;}
  const wireEl=t.closest?t.closest('[data-wire]'):null;
  if(wireEl){const id=wireEl.dataset.wire;
    if(!e.shiftKey){selection.nodes.clear();selection.wires.clear();selection.wires.add(id);}
    else selection.wires.has(id)?selection.wires.delete(id):selection.wires.add(id);
    selDirty=true;render();e.preventDefault();return;}
  if(!e.shiftKey&&(selection.nodes.size||selection.wires.size)){
    selection.nodes.clear();selection.wires.clear();selDirty=true;render();}});

svg.addEventListener('pointermove',e=>{
  const w=toWorld(e.clientX,e.clientY);
  $('#statusXY').textContent=`x ${Math.round(w.x)}, y ${Math.round(w.y)}`;
  if(!mode)return;
  if(mode.t==='pan'){view.x=mode.ox+(e.clientX-mode.sx);view.y=mode.oy+(e.clientY-mode.sy);renderScene();return;}
  if(mode.t==='drag'){
    if(!mode.snapped){if(Math.hypot(e.clientX-mode.sx,e.clientY-mode.sy)<3)return;
      snapshot();mode.snapped=true;}
    for(const g of mode.list){if(!g.n)continue;
      g.n.x=snap8(g.x0+(e.clientX-mode.sx)/view.k);
      g.n.y=snap8(g.y0+(e.clientY-mode.sy)/view.k);}
    renderScene();return;}
  if(mode.t==='resize'){const n=nodeById(mode.id);if(!n)return;
    if(!mode.snapped){snapshot();mode.snapped=true;}
    n.w=Math.max(snap8(mode.w0+(e.clientX-mode.sx)/view.k),KINDS[n.kind].cat==='frame'?120:40);
    n.h=Math.max(snap8(mode.h0+(e.clientY-mode.sy)/view.k),KINDS[n.kind].cat==='frame'?90:40);
    renderScene();return;}
  if(mode.t==='wire'){penCur=w;
    clearCompat();
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const termEl=el&&el.closest?el.closest('[data-term]'):null;
    if(termEl&&termEl.dataset.dir!==pending.dir)termEl.classList.add('compat');
    renderScene();}});

svg.addEventListener('pointerup',e=>{
  if(mode&&mode.t==='wire'&&pending){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const termEl=el&&el.closest?el.closest('[data-term]'):null;
    if(termEl)tryConnect(termEl);else pending=null;
    clearCompat();}
  mode=null;svg.style.cursor=spaceHeld?'grab':'default';render();});

svg.addEventListener('wheel',e=>{e.preventDefault();
  const r=svg.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  const w=toWorld(e.clientX,e.clientY);
  view.k=clamp(view.k*(e.deltaY<0?1.12:1/1.12),.2,5);
  view.x=sx-w.x*view.k;view.y=sy-w.y*view.k;renderScene();},{passive:false});

svg.addEventListener('dblclick',e=>{
  const nodeEl=e.target.closest?e.target.closest('g.node'):null;if(!nodeEl)return;
  const n=nodeById(nodeEl.dataset.node);if(!n)return;
  if(!selection.nodes.has(n.id)){selection.nodes.clear();selection.wires.clear();selection.nodes.add(n.id);selDirty=true;}
  if(n.kind==='boolConst'){snapshot();n.props.value=!n.props.value;render();return;}
  render();const i=$('#inspector').querySelector('input,textarea');if(i){i.focus();if(i.select)i.select();}});

window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||e.target.isContentEditable)return;
  if(e.code==='Space'){spaceHeld=true;if(!mode)svg.style.cursor='grab';e.preventDefault();return;}
  const ctrl=e.ctrlKey||e.metaKey,key=(e.key||'').toLowerCase();
  if(ctrl&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(ctrl&&key==='y'){e.preventDefault();redo();}
  else if(ctrl&&key==='d'){e.preventDefault();duplicateSel();}
  else if(ctrl&&key==='s'){e.preventDefault();saveJson();}
  else if(ctrl&&key==='o'){e.preventDefault();$('#fileInput').click();}
  else if(e.key==='Escape'){pending=null;clearCompat();closeModal();renderScene();}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelection();}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){spaceHeld=false;if(!mode)svg.style.cursor='default';}});

function deleteSelection(){if(!selection.nodes.size&&!selection.wires.size)return;
  snapshot();
  state.wires=state.wires.filter(w=>!selection.wires.has(w.id)&&!selection.nodes.has(w.from)&&!selection.nodes.has(w.to));
  state.nodes=state.nodes.filter(n=>!selection.nodes.has(n.id));
  selection.nodes.clear();selection.wires.clear();selDirty=true;render();renderPanel();
  toast('已删除选中对象');}
function duplicateSel(){const ids=[...selection.nodes];if(!ids.length)return;
  snapshot();const map={};const news=[];
  for(const id of ids){const src=nodeById(id);if(!src)continue;
    const c=structuredClone(src);delete c._val;delete c._flash;
    c.id='n'+(state.seq++);c.x+=24;c.y+=24;map[id]=c.id;news.push(c);}
  state.nodes.push(...news);
  for(const w of state.wires)if(map[w.from]&&map[w.to])
    state.wires.push({id:'w'+(state.seq++),from:map[w.from],fromTerm:w.fromTerm,to:map[w.to],toTerm:w.toTerm});
  selection.nodes=new Set(news.map(n=>n.id));selection.wires.clear();selDirty=true;render();renderPanel();}

function zoomAtCenter(f){const r=$('#canvasWrap').getBoundingClientRect();
  const cx=r.width/2,cy=r.height/2,w={x:(cx-view.x)/view.k,y:(cy-view.y)/view.k};
  view.k=clamp(view.k*f,.2,5);view.x=cx-w.x*view.k;view.y=cy-w.y*view.k;renderScene();}
function fitView(){const ns=state.nodes;if(!ns.length){view={x:40,y:40,k:1};renderScene();return;}
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const n of ns){x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+n.w);y2=Math.max(y2,n.y+n.h+18);}
  const r=$('#canvasWrap').getBoundingClientRect(),pad=60;
  const k=clamp(Math.min((r.width-pad*2)/(x2-x1),(r.height-pad*2)/(y2-y1)),.2,1.6);
  view.k=k;view.x=(r.width-(x1+x2)*k)/2;view.y=(r.height-(y1+y2)*k)/2;renderScene();}

/* ============ VI 二进制深挖:RSRC 容器(依 pylabview 逆向布局)+ zlib 解压 + 堆文本提取 ============ */
const rd4b=(b,o)=>String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);
function tryTextBytes(b){
  let hasHi=false;
  for(let i=0;i<b.length;i++){const c=b[i];if(c<0x20||c===0x7f)return null;if(c>=0x80)hasHi=true;}
  if(!hasHi)return String.fromCharCode.apply(null,b);
  try{const s=new TextDecoder('gbk',{fatal:true}).decode(b);
    if(/[\u4e00-\u9fff]/.test(s))return s;}catch(e){}
  return null;}
function extractLenPrefixed(b,little){
  const out=[],dv=new DataView(b.buffer,b.byteOffset,b.byteLength);let o=0;
  while(o+4<=b.length){
    const len=little?dv.getUint32(o,true):dv.getUint32(o);
    if(len>=3&&len<=256&&o+4+len<=b.length){
      const s=tryTextBytes(b.subarray(o+4,o+4+len));
      if(s){out.push(s);o+=4+len;continue;}}
    o++;}
  return out;}
function extractTexts(bytes){
  if(bytes.length>2*1024*1024)return[];
  const acc=new Set();
  const push=s=>{const t=s.trim();if(t.length>=3&&t.length<=200)acc.add(t);};
  extractLenPrefixed(bytes,false).forEach(push);
  extractLenPrefixed(bytes,true).forEach(push);
  let latin='';try{latin=new TextDecoder('latin1').decode(bytes);}catch(e){}
  for(const m of latin.matchAll(/[A-Za-z0-9_\u4e00-\u9fff][\x20-\x7e\u4e00-\u9fff]{4,}/g))push(m[0]);
  const drop=new Set(['BDHb','FPHb','BDHP','FPHp','FPHB','LIvi','PTH0','VICD','MUID','TITL','DFDS','LVAL','zlib','pako']);
  return [...acc].filter(s=>!drop.has(s)&&!/^(.)\1+$/.test(s)).slice(0,1500);}
function classifyStrings(list){
  const subvi=[],labels=[];
  for(const s of list){
    if(/\.(vi|vit|vim|ctl|llb|lvlib|lvlibp|lvclass|ctt|mnu)(["'\s]|$)|^\\\\?[\w.\- ]+\\\w/i.test(s))subvi.push(s);
    else labels.push(s);}
  return {subvi,labels};}
function decodeSection(u8,dv,pos,size){
  const rawSize=size;
  if(size>=8){
    const f4=rd4b(u8,pos),zsz=dv.getUint32(pos);
    if(!/^[\x20-\x7e]{4}$/.test(f4)&&u8[pos+4]===0x78&&zsz>0&&zsz<0x4000000){
      try{const out=pako.inflate(u8.subarray(pos+4,pos+size));
        if(out&&out.length===zsz)return{coding:'ZLIB',data:out,usize:zsz,rawSize};}catch(e){}}}
  return{coding:'RAW',data:u8.subarray(pos,pos+size),usize:size,rawSize};}
function parseVi(buf,name){
  const u8=new Uint8Array(buf),dv=new DataView(buf);
  const u32=o=>dv.getUint32(o);
  const rd4=o=>rd4b(u8,o);
  const res={name,size:u8.length,ok:false,note:'',fmtver:0,type:'',creator:'',
    version:null,versionSrc:'',sections:[],textAll:[],strs:{subvi:[],labels:[]},strings:[]};
  if(rd4(0)!=='RSRC'||!((u8[4]===0x0d&&u8[5]===0x0a)||(u8[4]===0&&u8[5]===0))){
    res.note='不是 RSRC 容器(LabVIEW 4+ 的 .vi 应以 RSRC 开头)。';return res;}
  res.ok=true;
  res.fmtver=(u8[6]<<8)|u8[7];
  res.type=rd4(8);res.creator=rd4(12);
  const bcd=b=>((b>>4)*10+(b&15));
  const dataOfs=u32(24),dataSize=u32(28);
  /* 链式头:沿 info_offset 走到指向自身的头,其后 32B 起为目录 */
  let last=0,cur=u32(16),guard=0;
  while(cur>last&&cur+32<=u8.length&&guard++<8){last=cur;const nx=u32(cur+16);if(nx<=cur)break;cur=nx;}
  if(last>0){const c2=rd4(last+12);
    if(c2!=='LBVW'&&c2!=='ResC'&&c2!=='Doug'){
      const v=[u8[last+12],u8[last+13],u8[last+14]].map(bcd);
      if(v[0]>=4&&v[0]<=30){res.version=v.join('.');res.versionSrc='头部 BCD';}}}
  const dirAt=last+32,blkAt=last+52;
  const secsAgg=[];
  try{
    if(u32(dirAt+8)!==32)throw new Error('目录校验字不符');
    const n=u32(blkAt);
    if(n>4095)throw new Error('类型数超限');
    for(let t=0;t<=n;t++){
      const p=blkAt+4+t*12;
      if(p+12>u8.length)break;
      const code=rd4(p),count=u32(p+4),off=u32(p+8);
      if(!/^[\x20-\x7e]{4}$/.test(code)||count>65535)continue;
      const sa=blkAt+4+off;
      if(sa<blkAt||sa+count*20>u8.length)continue;
      const decs=[];let heapFmt='';
      for(let i=0;i<=count;i++){
        const q=sa+i*20;
        const dp=dataOfs+u32(q+12);
        if(dp+4>u8.length)continue;
        const sz=u32(dp);
        if(sz>u8.length-dp-4)continue;
        const sec=decodeSection(u8,dv,dp+4,sz);
        if(!heapFmt&&sec.data.length>=4){const h=rd4b(sec.data,0);
          if(/^(BDH|FPH|LIvi|DFDS|VICD)/.test(h))heapFmt=h;}
        decs.push(sec);
        if(sec.data.length&&(code.startsWith('BD')||code.startsWith('FP')||
            ['LIvi','DFDS','VICD','vers','TITL','MUID'].includes(code)||sec.coding==='ZLIB'))
          extractTexts(sec.data).forEach(s=>res.textAll.push(s));}
      if(decs.length)secsAgg.push({code,decs,heapFmt});}
  }catch(e){res.note+=' 区块目录解析失败('+e.message+'),仅显示文件头信息。';}
  res.sections=secsAgg;
  if(!res.textAll.length){extractTexts(u8).forEach(s=>res.textAll.push(s));}
  res.textAll=[...new Set(res.textAll)].slice(0,1500);
  res.strs=classifyStrings(res.textAll);
  const vs=secsAgg.find(s=>s.code==='vers');
  if(vs){try{const t=new TextDecoder('latin1').decode(vs.decs[0].data).trim();
    const m=t.match(/\d{1,2}\.\d{1,2}/);
    if(m&&!res.version){res.version=m[0];res.versionSrc='vers 区块';}}catch(e){}}
  try{const s=new TextDecoder('latin1').decode(u8);
    res.strings=[...new Set([...s.matchAll(/LabVIEW[ ]?[0-9][0-9a-zA-Z.]{0,8}/g)].map(m=>m[0]))].slice(0,6);}catch(e){}
  return res;}

function showViImport(res){
  const fsize=(n)=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
  const secRows=res.sections.length?res.sections.map(s=>{
    const tot=s.decs.reduce((a,d)=>a+d.rawSize,0);
    const usz=s.decs.reduce((a,d)=>a+(d.usize||d.rawSize),0);
    const zl=s.decs.some(d=>d.coding==='ZLIB');
    return `<tr><td>${esc(s.code)}</td><td>${s.decs.length}</td><td>${zl?'zlib':'—'}</td>`+
      `<td>${fsize(usz)}${usz!==tot?' <span style="color:var(--ink-3)">'+fsize(tot)+'</span>':''}</td><td>${esc(s.heapFmt||'')}</td></tr>`;
  }).join(''):'<tr><td colspan="5" style="color:var(--ink-3)">未解析出区块目录 —— 该文件可能使用了未知布局,仅展示文件头与全文文本扫描结果。</td></tr>';
  const list=(arr)=>arr.length?`<div class="xlist">${arr.slice(0,60).map(s=>`<div>${esc(s)}</div>`).join('')}`+
    (arr.length>60?`<div style="color:var(--ink-3)">… 共 ${arr.length} 条</div>`:'')+'</div>'
    :'<p style="color:var(--ink-3);margin:4px 0 10px">(无)</p>';
  const body=`
   <div class="kv"><span>文件</span><b>${esc(res.name)}</b></div>
   <div class="kv"><span>大小</span><b>${fsize(res.size)}</b></div>
   <div class="kv"><span>容器</span><b>${esc(res.type)} / ${esc(res.creator)} · 格式 v${res.fmtver}</b></div>
   <div class="kv"><span>LabVIEW 版本</span><b>${esc(res.version||'?')}${res.versionSrc?` <span style="color:var(--ink-3)">(${esc(res.versionSrc)})</span>`:''}</b></div>
   ${res.strings.length?`<div class="kv"><span>内嵌版本串</span><b>${esc(res.strings.join(' / '))}</b></div>`:''}
   ${res.note?`<p style="color:#8a4a3a;margin:4px 0">${esc(res.note)}</p>`:''}
   <table class="mtable"><tr><th>区块代码</th><th>段数</th><th>编码</th><th>解压后/原始</th><th>堆标识</th></tr>${secRows}</table>
   <div class="kv" style="margin-top:10px"><span>子VI / 库引用</span><b>${res.strs.subvi.length} 条</b></div>
   ${list(res.strs.subvi)}
   <div class="kv"><span>标签 / 常量 / 其他文本</span><b>${res.strs.labels.length} 条</b></div>
   ${list(res.strs.labels)}
   <p style="color:var(--ink-2);margin-top:8px">以上文本来自解压后的框图(BDHb)/前面板(FPHb)等区块 ——
   节点标签、常量值、子VI 路径都在其中。区块内部的对象树(节点/连线结构)仍是 NI 私有格式,未做完整解码;
   可将提取结果作为<b>注记</b>放入工程,或据这些线索在画布上重建逻辑。</p>`;
  showModal({title:'VI 深挖(只读)',bodyHTML:body,
    buttons:[{label:'关闭'},{label:'载入为工程注记',primary:true,fn(){
      snapshot();
      state.meta={source:'vi:'+res.name,labview:res.version};
      $('#srcChip').textContent=state.meta.source;
      const lines=[`VI 导入注记 — ${res.name}`,
        `大小:${fsize(res.size)} · ${res.type}/${res.creator} · 格式 v${res.fmtver}`,
        `LabVIEW 版本:${res.version||'?'}`+(res.versionSrc?` (${res.versionSrc})`:'')];
      if(res.sections.length)lines.push(`区块(${res.sections.length}):`+res.sections.slice(0,12).map(s=>s.code+(s.heapFmt?`[${s.heapFmt}]`:'')).join(' '));
      if(res.strs.subvi.length)lines.push(`子VI/库引用(${res.strs.subvi.length}):`+res.strs.subvi.slice(0,15).join(' , '));
      if(res.strs.labels.length)lines.push(`标签/常量(${res.strs.labels.length}):`+res.strs.labels.slice(0,25).join(' , '));
      const r=$('#canvasWrap').getBoundingClientRect();
      const n=addNode('note',(r.width/2-view.x)/view.k-140,(r.height/2-view.y)/view.k-80);
      n.w=420;n.h=90+lines.join('\n').length/22*12;
      n.props.text=lines.join('\n');n.label=res.name;
      render();renderPanel();toast('已将 VI 提取结果写入注记节点');}}]});}

/* ================= 导入 / 导出 ================= */
const fileInput=$('#fileInput');
function openFile(file){
  const fr=new FileReader();
  fr.onload=()=>{const buf=fr.result;
    const u8=new Uint8Array(buf);
    if(u8[0]===0x52&&u8[1]===0x53&&u8[2]===0x52&&u8[3]===0x43){showViImport(parseVi(buf,file.name));return;}
    try{const o=JSON.parse(new TextDecoder().decode(buf));
      if(o.format!=='tong-vi-doc')throw new Error('缺少 format: "tong-vi-doc" 标识');
      let dropped=0;
      o.nodes=(o.nodes||[]).filter(n=>{if(KINDS[n.kind]){delete n._val;delete n._flash;return true;}dropped++;return false;});
      o.wires=(o.wires||[]).filter(w=>o.nodes.some(n=>n.id===w.from)&&o.nodes.some(n=>n.id===w.to));
      snapshot();applyDoc(JSON.stringify(o));
      $('#projName').value=state.name;$('#srcChip').textContent=state.meta.source||'json';
      undoStack.length=0;redoStack.length=0;updateUndoBtns();
      render();renderPanel();fitView();
      toast(`已载入工程「${state.name}」`+(dropped?`(忽略 ${dropped} 个未知节点)`:''));}
    catch(err){toast('无法解析:不是 RSRC(VI)也不是本工具的 JSON 工程 — '+err.message);}};
  fr.readAsArrayBuffer(file);}
fileInput.addEventListener('change',()=>{if(fileInput.files[0])openFile(fileInput.files[0]);fileInput.value='';});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])openFile(e.dataTransfer.files[0]);});

function docJson(){return {format:'tong-vi-doc',version:1,name:state.name,meta:state.meta,
  nodes:state.nodes.map(n=>({id:n.id,kind:n.kind,label:n.label,x:n.x,y:n.y,w:n.w,h:n.h,props:n.props})),
  wires:state.wires.map(w=>({id:w.id,from:w.from,fromTerm:w.fromTerm,to:w.to,toTerm:w.toTerm})),
  seq:state.seq};}
function saveJson(){download(new Blob([JSON.stringify(docJson(),null,2)],{type:'application/json'}),
  safeName(state.name)+'.vidoc.json');toast('已导出工程 JSON(可再次导入继续编辑)');}

function buildExportSvg(){
  if(!state.nodes.length)throw new Error('画布为空');
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const n of state.nodes){x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+n.w);y2=Math.max(y2,n.y+n.h+20);}
  const M=70,W=Math.max(Math.ceil(x2-x1)+M*2,640),H=Math.max(Math.ceil(y2-y1)+M*2+70,480);
  const s=document.createElementNS(SVGNS,'svg');
  s.setAttribute('xmlns',SVGNS);s.setAttribute('width',W);s.setAttribute('height',H);s.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const defs=S('defs',{},s);
  const pat=S('pattern',{id:'xgrid',width:16,height:16,patternUnits:'userSpaceOnUse'},defs);
  S('circle',{cx:8,cy:8,r:.9,fill:'#a5a29c'},pat);
  const fl=S('filter',{id:'xshadow',x:'-20%',y:'-20%',width:'140%',height:'160%'},defs);
  const fe=document.createElementNS(SVGNS,'feDropShadow');
  [['dx',0],['dy',1.5],['stdDeviation',1.3],['flood-color','#3a3833'],['flood-opacity',.22]].forEach(([k,v])=>fe.setAttribute(k,v));
  fl.appendChild(fe);
  S('rect',{width:W,height:H,fill:'#c9c6c0'},s);
  S('rect',{width:W,height:H,fill:'url(#xgrid)'},s);
  const tr=S('g',{transform:`translate(${-x1+M},${-y1+M})`},s);
  const gU=S('g',{},tr),gW=S('g',{},tr),gN=S('g',{},tr);
  for(const n of state.nodes)if(KINDS[n.kind].cat==='frame')drawNode(n,gU,{export:true});
  for(const w of state.wires)drawWire(w,gW,{export:true});
  for(const n of state.nodes)if(KINDS[n.kind].cat!=='frame')drawNode(n,gN,{export:true});
  /* 图签 */
  const bx=W-330,by=H-104;
  const tb=S('g',{},s);
  S('rect',{x:bx,y:by,width:300,height:74,fill:'#cdcac4',stroke:'#494640','stroke-width':1.2},tb);
  S('line',{x1:bx,y1:by+28,x2:bx+300,y2:by+28,stroke:'#8f8c86'},tb);
  S('line',{x1:bx,y1:by+52,x2:bx+300,y2:by+52,stroke:'#8f8c86'},tb);
  S('line',{x1:bx+190,y1:by+28,x2:bx+190,y2:by+74,stroke:'#8f8c86'},tb);
  let t=S('text',{x:bx+12,y:by+20,'font-family':FONT_SERIF,'font-size':14,fill:'#292722'},tb);t.textContent=state.name;
  t=S('text',{x:bx+12,y:by+46,'font-family':FONT_UI,'font-size':11,fill:'#57544d'},tb);t.textContent='程序框图 BLOCK DIAGRAM';
  t=S('text',{x:bx+12,y:by+67,'font-family':'ui-monospace,Consolas,monospace','font-size':10.5,fill:'#57544d'},tb);
  t.textContent=`比例 ${Math.round(view.k*100)}% · ${new Date().toISOString().slice(0,10)}`;
  t=S('text',{x:bx+202,y:by+46,'font-family':FONT_UI,'font-size':11,fill:'#57544d'},tb);t.textContent='砼 VI 编辑器';
  t=S('text',{x:bx+202,y:by+67,'font-family':FONT_UI,'font-size':10.5,fill:'#7c786f'},tb);t.textContent='fair-faced output';
  return s;}

function exportSvg(){try{const s=buildExportSvg();
  const str='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(s);
  download(new Blob([str],{type:'image/svg+xml;charset=utf-8'}),safeName(state.name)+'-框图.svg');
  toast('已导出 SVG(含图签)');}catch(e){toast(e.message);}}
function exportPng(){try{const s=buildExportSvg();
  const str=new XMLSerializer().serializeToString(s);
  const url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=s.width.baseVal.value*2;c.height=s.height.baseVal.value*2;
    const ctx=c.getContext('2d');ctx.fillStyle='#c9c6c0';ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>{download(b,safeName(state.name)+'-框图.png');toast('已导出 PNG');});};
  img.onerror=()=>toast('PNG 渲染失败');
  img.src=url;}catch(e){toast(e.message);}}

/* ================= 弹层 ================= */
const modalWrap=$('#modalWrap');
function closeModal(){modalWrap.style.display='none';}
function showModal({title,bodyHTML,buttons,onOpen}){
  $('#mTitle').textContent=title;$('#mBody').innerHTML=bodyHTML;
  const foot=$('#mFoot');foot.innerHTML='';
  for(const b of buttons||[]){const el=document.createElement('button');
    el.className='btn'+(b.primary?' primary':'');el.textContent=b.label;
    el.addEventListener('click',()=>{closeModal();b.fn&&b.fn();});foot.appendChild(el);}
  modalWrap.style.display='grid';
  if(onOpen)onOpen($('#mBody'));}
modalWrap.addEventListener('click',e=>{if(e.target===modalWrap)closeModal();});

/* ================= 顶栏动作 ================= */
$('#btnNew').addEventListener('click',()=>{
  if(!state.nodes.length){newDoc();return;}
  showModal({title:'新建工程',bodyHTML:'<p>新建将清空当前画布(之后仍可用 Ctrl+Z 撤销恢复)。</p>',
    buttons:[{label:'取消'},{label:'新建',primary:true,fn:newDoc}]});});
function newDoc(){snapshot();state={name:'未命名工程',meta:{source:'new',labview:null},nodes:[],wires:[],seq:1};
  $('#projName').value=state.name;$('#srcChip').textContent='new';
  selection.nodes.clear();selection.wires.clear();selDirty=true;render();renderPanel();fitView();}
$('#btnOpen').addEventListener('click',()=>fileInput.click());
$('#btnSave').addEventListener('click',saveJson);
$('#btnSvg').addEventListener('click',exportSvg);
$('#btnPng').addEventListener('click',exportPng);
$('#btnUndo').addEventListener('click',undo);
$('#btnRedo').addEventListener('click',redo);
$('#btnRun').addEventListener('click',runProgram);
$('#statusErr').addEventListener('click',()=>showErrList(lastIssues.errs.concat(lastIssues.warns)));
$('#btnDemo').addEventListener('click',()=>{loadDemo();toast('已载入演示工程(可 Ctrl+Z 撤销)');});
$('#btnHelp').addEventListener('click',showHelp);
$('#projName').addEventListener('change',()=>{state.name=$('#projName').value||'未命名工程';autosave();});

function showHelp(){showModal({title:'说明',bodyHTML:`
  <p><b>这是什么</b> —— 浏览器内的 LabVIEW 风格数据流编辑器(教学/草图用途,非 NI 官方工具):
  左侧调板放置控件、常数、函数与结构框,拖动彩色端子连线,<b>▶ 运行</b>做数据流求值并把结果写进指示器与前面板。</p>
  <p style="margin-top:8px"><b>VI 二进制的边界</b> —— .vi 是 NI 专有压缩二进制格式。
  本工具导入 .vi 时按社区逆向成果(pylabview)解析 RSRC 容器、解压 zlib 区块,提取框图/前面板里的<b>文本</b>
  (标签、常量、子VI 引用)供查看;<b>对象树(节点/连线)未完整解码,也不能写回 .vi</b>。
  可编辑工程请用「保存工程」导出的 <b>.vidoc.json</b>(完整可再编辑),另可导出带图签的 SVG / PNG。</p>
  <p style="margin-top:8px"><b>操作</b> —— 调板点击/拖放添加;端子拖到对侧端子连线(从已接输入拖动=改接);
  断线=虚线;空格+拖动平移,滚轮缩放;Delete 删除,Ctrl+Z/Y/D/S/O;双击真假常数取反;结构框选中后拖右下角拉伸。</p>
  <p style="margin-top:8px"><b>运行语义</b> —— 严格类型检查;For/While 框按<b>几何包含</b>迭代内部节点
  (随机数每轮重算);While 的「停」端子为真时停止,上限 10000 次。</p>`,
  buttons:[{label:'知道了',primary:true}]});}
